<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Charles Cleaning</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div class="brand" aria-label="Charles Cleaning logo and brand">
          <img src="../assets/charles-cleaning-logo.png" alt="Charles Cleaning logo" />
          <div class="brand-text">
            <span>Charles</span>
            <small>Cleaning</small>
          </div>
        </div>
<!-- Navigation -->
        <nav class="main-nav" aria-label="Main navigation">
          <a href="homepage.html">Home</a>
          <a href="aboutuspage.html">About Us</a>
          <a href="servicespage.html">Services</a>
          <a href="gallerypage.html">Gallery</a>
          <a href="quotepage.html">Quote</a>
          <a href="onlinebookingpage.html">Booking</a>
          <a class="active" href="contactpage.html">Contact</a>
        </nav>
      </header>
<!-- Main content -->
      <main class="content">
        <header class="page-header">
          <div class="badge">Get in touch</div>
          <h1>Contact us</h1>
          <p>Book a service, ask a question, or request a quote from our friendly team.</p>
        </header>
<!-- Contact information and map section -->
        <section class="contact-grid">
          <div class="contact-list">
            <article class="contact-card">
              <h3>Email</h3>
              <p>charliscleaning19@gmail.com</p>
            </article>

            <article class="contact-card">
              <h3>Phone</h3>
              <p>+27 77 403 3212</p>
            </article>

            <article class="contact-card">
              <h3>WhatsApp</h3>
              <p><a href="https://wa.me/27774033212" target="_blank">Chat on WhatsApp</a></p>
            </article>
          </div>
<!-- Map section -->
          <div class="map-shell">
            <iframe
              title="Charles Cleaning location map"
              src="https://maps.google.com/maps?q=johannesburg%20gauteng&t=&z=11&ie=UTF8&iwloc=&output=embed"
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
            ></iframe>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
